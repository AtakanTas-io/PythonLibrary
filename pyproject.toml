[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-library"
version = "0.3.0"
description = "Günlük işleri otomatize eden çok amaçlı yardımcı Python kütüphanesi ve CLI aracı"
readme = "README.md"
authors = [
    { name = "AtakaanShiva" }
]
requires-python = ">=3.9"
keywords = ["automation", "qr-code", "pdf", "crypto", "speedtest", "image-tools", "hasher", "ocr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "pyqrcode>=1.2.1",
    "pypng>=0.20220715.0",
    "pdf2docx>=0.5.8",
    "rembg>=2.0.50",
    "pillow>=10.0.0",
    "plyer>=2.1.0",
    "schedule>=1.2.0",
    "cryptography>=41.0.0",
    "speedtest-cli>=2.1.3",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
    "markdown-it-py>=3.0.0",
    "requests>=2.28.0",
    "dnspython>=2.4.0",
    "pypdf>=3.10.0",
    "pytesseract>=0.3.10",
    "yt-dlp>=2023.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.1.0",
]

[project.scripts]
python-library = "python_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=python_library --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
